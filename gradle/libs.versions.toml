[versions]
morphe-patcher = "2.1.0"
#noinspection GradleDependency
smali = "d92701d947"
gson = "2.15.0"
junit = "4.13.2"
assertj = "3.26.2"
robolectric = "4.9.0"
okhttp = "4.12.0"
json = "20240107"
spring-javaformat = "0.0.43"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
morphe-extensions = { module = "app.morphe:morphe-extensions", version = "2.1.0" }
junit = { module = "junit:junit", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
json = { module = "org.json:json", version.ref = "json" }
androidx-annotation = { module = "androidx.annotation:annotation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-webkit = { module = "androidx.webkit:webkit" }
spring-javaformat-checkstyle = { module = "io.spring.javaformat:spring-javaformat-checkstyle", version.ref = "spring-javaformat" }