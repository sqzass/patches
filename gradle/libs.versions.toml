[versions]
morphe-patcher = "1.15.1"
#noinspection GradleDependency
smali = "d92701d947"
gson = "2.15.0"
junit = "4.13.2"
assertj = "3.26.2"
robolectric = "4.9.0"
okhttp = "4.12.0"
json = "20240107"
compose_ui = "1.0.1"
compose_runtime = "1.0.1"
compose_foundation = "1.0.1"
compose_webkit = "1.0.1"
spring_javaformat = "4.0.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
morphe-extensions = { module = "app.morphe:morphe-extensions", version = "1.15.1" }
junit = { module = "junit:junit", version.ref = "junit" }
assertj = { module = "org.assertj:assertj-core" }
robolectric = { module = "org.robolectric:robolectric" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
json = { module = "com.google.code.gson:gson" }
compose_ui = { module = "androidx.compose.ui:ui" }
compose_runtime = { module = "androidx.compose.runtime:runtime" }
compose_foundation = { module = "androidx.compose.foundation:foundation" }
compose_webkit = { module = "androidx.webkit:webkit" }
spring-javaformat-checkstyle = { module = "org.checkerframework:checker-qual", version.ref = "spring_javaformat" }